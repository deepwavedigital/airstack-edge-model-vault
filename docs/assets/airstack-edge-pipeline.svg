<svg xmlns="http://www.w3.org/2000/svg" width="1512" height="500" viewBox="44 0 1512 500" role="img" aria-labelledby="title desc">
  <title id="title">AirStack Edge inference pipeline</title>
  <desc id="desc">An RF receiver sends IQ stream and metadata to a three-stage NVIDIA Triton pipeline, which posts JSON and binary output to a webhook. The AirStack Edge Control Plane sits beneath the pipeline, and an external Remote Control service communicates bidirectionally with it through a REST API.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f6f9ff"/>
      <stop offset="1" stop-color="#e8f0fe"/>
    </linearGradient>
    <linearGradient id="triton" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#86c900"/>
      <stop offset="1" stop-color="#5d9700"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
    <style>
      .label { font-family: Arial, Helvetica, sans-serif; fill: #0f172a; }
      .eyebrow { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 1.6px; fill: #475569; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 19px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 13px; fill: #64748b; }
      .card-title { font-family: Arial, Helvetica, sans-serif; font-size: 17px; font-weight: 700; fill: #0f172a; }
      .flow { font-family: Arial, Helvetica, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: .8px; fill: #475569; }
      .flow-green { font-family: Arial, Helvetica, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: .8px; fill: #315500; }
    </style>
  </defs>

  <rect x="44" width="1512" height="500" rx="20" fill="#fff"/>

  <!-- AirStack Edge boundary -->
  <rect x="76" y="32" width="1179" height="435" rx="18" fill="url(#edge)" stroke="#bfd1ee" stroke-width="2"/>
  <text x="104" y="72" class="title">AirStack Edge</text>
  <text x="104" y="100" class="subtitle">RF data is processed locally before it is delivered to an external integration.</text>

  <!-- Radio Driver -->
  <g filter="url(#shadow)">
    <rect x="122" y="203" width="160" height="144" rx="10" fill="#fff" stroke="#9eb7db" stroke-width="2"/>
  </g>
  <text x="202" y="269" text-anchor="middle" class="card-title">Radio Driver</text>
  <text x="202" y="291" text-anchor="middle" class="subtitle">Signal source</text>

  <!-- NVIDIA Triton boundary -->
  <rect x="407" y="151" width="800" height="196" rx="15" fill="url(#triton)" stroke="#4c7d00" stroke-width="2"/>
  <text x="438" y="185" class="card-title" fill="#173000">NVIDIA TRITON</text>
  <text x="438" y="207" class="subtitle" fill="#173000">Inference and stream-processing pipeline</text>

  <!-- model cards -->
  <g filter="url(#shadow)">
    <rect x="438" y="236" width="160" height="78" rx="10" fill="#fff"/>
    <rect x="727" y="236" width="160" height="78" rx="10" fill="#fff"/>
    <rect x="1016" y="236" width="160" height="78" rx="10" fill="#fff"/>
  </g>
  <text x="518" y="269" text-anchor="middle" class="card-title">Model 1</text>
  <text x="518" y="291" text-anchor="middle" class="subtitle">Input processing</text>
  <text x="807" y="269" text-anchor="middle" class="card-title">Model 2</text>
  <text x="807" y="291" text-anchor="middle" class="subtitle">Inference</text>
  <text x="1096" y="269" text-anchor="middle" class="card-title">Batcher</text>
  <text x="1096" y="291" text-anchor="middle" class="subtitle">Response assembly</text>

  <!-- AirStack Edge control plane -->
  <g filter="url(#shadow)">
    <rect x="122" y="382" width="1085" height="60" rx="10" fill="#dce8fa" stroke="#9eb7db" stroke-width="2"/>
  </g>
  <text x="664.5" y="418" text-anchor="middle" class="card-title">AirStack Edge Control Plane</text>

  <!-- data paths -->
  <path d="M282 257H438" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M282 294H438" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="360" y="247" text-anchor="middle" class="flow">IQ STREAM</text>
  <text x="360" y="313" text-anchor="middle" class="flow">METADATA</text>

  <path d="M598 257H727" fill="none" stroke="#315500" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M598 294H727" fill="none" stroke="#315500" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="662.5" y="247" text-anchor="middle" class="flow-green">OUT STREAM</text>
  <text x="662.5" y="313" text-anchor="middle" class="flow-green">METADATA</text>

  <path d="M887 257H1016" fill="none" stroke="#315500" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M887 294H1016" fill="none" stroke="#315500" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="951.5" y="247" text-anchor="middle" class="flow-green">OUT STREAM</text>
  <text x="951.5" y="313" text-anchor="middle" class="flow-green">METADATA</text>

  <!-- control plane -->
  <path d="M1207 412H1354" fill="none" stroke="#475569" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="1280.5" y="401" text-anchor="middle" class="flow">REST API</text>
  <g filter="url(#shadow)">
    <rect x="1360" y="373" width="160" height="78" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
  </g>
  <text x="1440" y="405" text-anchor="middle" class="card-title">Remote Control</text>
  <text x="1440" y="427" text-anchor="middle" class="subtitle">C2 or MCP Server</text>

  <!-- external delivery -->
  <path d="M1176 275H1354" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1265" y="263" text-anchor="middle" class="flow">POST</text>
  <g filter="url(#shadow)">
    <rect x="1360" y="236" width="160" height="78" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
  </g>
  <text x="1440" y="269" text-anchor="middle" class="card-title">Webhook</text>
  <text x="1440" y="291" text-anchor="middle" class="subtitle">External Delivery</text>
</svg>
